services:
  - type: web
    name: sea-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PRODUCTION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sea-db
          property: connectionString

databases:
  - name: sea-db
    databaseName: sea
    plan: free
